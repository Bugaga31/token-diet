name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,tiktoken]"
      - name: Quick checks (doctor + self-test + docs)
        run: |
          python -m token_diet.cli doctor
          python -m token_diet.cli self-test
          python -m token_diet.cli docs
      - name: Pytest
        run: |
          python -m pytest tests -q
      - name: CI check (benchmark + gate + packaging)
        run: |
          python ci_check.py
      - name: Benchmark compete smoke
        run: |
          python benchmark_compete.py 2>&1 | head -n 60
