[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-diet"
version = "3.27.1"
description = "Track. Optimize. Achieve. — AI cost optimization for the planet and the people."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "token-diet", email = "hello@token-diet.dev"}]
keywords = ["llm", "token-compression", "context-engineering", "prompt-caching", "agent-memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Bugaga31/token-diet"
Repository = "https://github.com/Bugaga31/token-diet"

[project.scripts]
token-diet = "token_diet.cli:main"
token-diet-setup = "token_diet.auto_setup:main"

[project.optional-dependencies]
server = ["fastapi", "uvicorn", "httpx"]
tinkoff = ["tinkoff-invest-python"]
tiktoken = ["tiktoken"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["token_diet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
# legacy single-file archive, intentionally minified
extend-exclude = ["token_diet/original_full.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# long regex lines in loss_router/context_memory; style-only concern
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap before imports is the standard standalone-test pattern
"tests/test_competitive.py" = ["E402"]
"tests/test_distiller_selector.py" = ["E402"]
"tests/test_green.py" = ["E402"]
"tests/test_intelligence_booster.py" = ["E402"]
"tests/test_sherlock.py" = ["E402"]
"tests/test_smart_multiplier.py" = ["E402"]
# __init__: lazy-import table must exist before the importlib hook
"token_diet/__init__.py" = ["E402"]
# server/tg modules: path bootstrap / telethon log-silencing precede imports
"token_diet/autopilot.py" = ["E402"]
"token_diet/server.py" = ["E402"]
"token_diet/tg_intel.py" = ["E402"]
"token_diet/tg_scout.py" = ["E402"]
